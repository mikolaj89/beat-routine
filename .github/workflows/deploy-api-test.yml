name: Deploy test API

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-api-test
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Setup SSH
        shell: bash
        run: |
          mkdir -p ~/.ssh
          printf '%s' '${{ secrets.DROPLET_SSH_KEY_B64 }}' | base64 -d > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.DROPLET_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy on Droplet
        shell: bash
        run: |
          DEPLOYED_AT="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          ssh -i ~/.ssh/id_ed25519 "${{ secrets.DROPLET_USER }}@${{ secrets.DROPLET_HOST }}" 'bash -se' <<EOF
          cat > /root/beat-routine-api-deploy/test/test.env <<EOT
          NODE_ENV=test
          HOST=0.0.0.0
          PORT=8000
          API_BASE_URL=http://167.71.34.89:8000
          ACCESS_TOKEN_TTL_SECONDS=900
          REFRESH_TOKEN_TTL_DAYS=30
          COOKIE_SAMESITE=lax
          DB_URL=${{ secrets.DB_URL }}
          JWT_ACCESS_SECRET=${{ secrets.JWT_ACCESS_SECRET }}
          APP_GIT_SHA=${{ github.sha }}
          APP_DEPLOYED_AT=${DEPLOYED_AT}
          EOT

          chmod 600 /root/beat-routine-api-deploy/test/test.env

          cd /root/beat-routine
          git fetch --prune origin
          git checkout main
          git reset --hard origin/main
          git clean -fd

          docker build -f apps/api/Dockerfile -t drum-scheduler-api .

          bash /root/beat-routine-api-deploy/test/run-test-api-2.sh
          EOF
