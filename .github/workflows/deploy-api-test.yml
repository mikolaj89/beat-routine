name: Deploy test API

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-api-test
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Setup SSH
        shell: bash
        run: |
          mkdir -p ~/.ssh
          printf '%s' '${{ secrets.DROPLET_SSH_KEY_B64 }}' | base64 -d > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.DROPLET_HOST }}" >> ~/.ssh/known_hosts

      - name: Validate SSH key
        shell: bash
        run: |
          ssh-keygen -y -f ~/.ssh/id_ed25519 > ~/.ssh/id_ed25519.pub
          ssh-keygen -lf ~/.ssh/id_ed25519.pub

      - name: Debug non-secret inputs
        shell: bash
        run: |
          echo "DROPLET_HOST=${{ secrets.DROPLET_HOST }}"
          echo "DROPLET_USER=${{ secrets.DROPLET_USER }}"

      - name: Debug SSH connection
        shell: bash
        run: |
          ssh -vvv -i ~/.ssh/id_ed25519 "${{ secrets.DROPLET_USER }}@${{ secrets.DROPLET_HOST }}" exit