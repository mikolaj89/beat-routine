name: Deploy test API

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-api-test
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Setup SSH
        env:
          DROPLET_SSH_KEY: ${{ secrets.DROPLET_SSH_KEY }}
        shell: bash
        run: |
          mkdir -p ~/.ssh
          if [[ -z "${DROPLET_SSH_KEY}" ]]; then
            echo "Missing secret DROPLET_SSH_KEY (paste full ~/.ssh/id_ed25519 private key)" >&2
            exit 1
          fi
          printf '%s\n' "${DROPLET_SSH_KEY}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          if ! ssh-keygen -y -f ~/.ssh/id_ed25519 >/dev/null 2>&1; then
            echo "DROPLET_SSH_KEY could not be loaded." >&2
            echo "If your laptop key has a passphrase, CI cannot use it. Create a deploy-only key without passphrase:" >&2
            echo "  ssh-keygen -t ed25519 -f ~/.ssh/beat_routine_deploy -N \"\" -C \"github-actions-deploy\"" >&2
            echo "  cat ~/.ssh/beat_routine_deploy.pub   # add this line to the Droplet authorized_keys" >&2
            echo "  cat ~/.ssh/beat_routine_deploy         # paste into GitHub secret DROPLET_SSH_KEY" >&2
            exit 1
          fi
          ssh-keyscan -H "${{ secrets.DROPLET_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy on Droplet
        shell: bash
        run: |
          DEPLOYED_AT="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          ssh -i ~/.ssh/id_ed25519 "${{ secrets.DROPLET_USER }}@${{ secrets.DROPLET_HOST }}" 'bash -se' <<EOF
          mkdir -p /root/beat-routine-api-deploy/test

          cat > /root/beat-routine-api-deploy/test/test.env <<EOT
          NODE_ENV=test
          HOST=0.0.0.0
          PORT=8000
          API_BASE_URL=http://46.101.174.67:8000
          ACCESS_TOKEN_TTL_SECONDS=900
          REFRESH_TOKEN_TTL_DAYS=30
          COOKIE_SAMESITE=lax
          DB_URL=${{ secrets.DB_URL }}
          JWT_ACCESS_SECRET=${{ secrets.JWT_ACCESS_SECRET }}
          APP_GIT_SHA=${{ github.sha }}
          APP_DEPLOYED_AT=${DEPLOYED_AT}
          EOT

          chmod 600 /root/beat-routine-api-deploy/test/test.env

          cd /root/beat-routine
          git fetch --prune origin
          git checkout main
          git reset --hard origin/main
          git clean -fd

          docker build -f apps/api/Dockerfile -t drum-scheduler-api .

          cp deploy/api-test/run-test-api-2.sh /root/beat-routine-api-deploy/test/
          chmod +x /root/beat-routine-api-deploy/test/run-test-api-2.sh
          bash /root/beat-routine-api-deploy/test/run-test-api-2.sh
          EOF
